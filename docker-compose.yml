services:
  mock-api:
    build:
      context: .
      dockerfile: load-tests/mock-server/Dockerfile
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/productsList', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mock-api:
        condition: service_healthy
    environment:
      - MOCK_API_URL=http://mock-api:4000
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    command: ["npx", "playwright", "test"]